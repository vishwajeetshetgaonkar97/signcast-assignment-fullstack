<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <!-- <meta http-equiv="Content-Security-Policy" content="default-src *; connect-src *; script-src *; style-src 'self' 'unsafe-inline'; img-src *; font-src *; media-src *;"> -->

  <!-- 
Content Security Policy (CSP) allows loading resources only from trusted sources, enhancing security by mitigating attacks like XSS.
 default-src 'self' : Restricts all resources to be loaded from the same origin unless specified otherwise.
 connect-src 'self' https: wss: ws: : Allows connections (AJAX, WebSockets, etc.) only to the same origin or trusted protocols (HTTPS, WebSocket).
 script-src 'self' : Permits loading scripts only from the same origin (restricting third-party scripts).
style-src 'self' 'unsafe-inline' : Permits styles from the same origin and inline styles. 'unsafe-inline' should be avoided if not needed.
 img-src 'self' data: http: https: : Allows images from the same origin, data URIs, and both HTTP and HTTPS protocols.
font-src 'self' : Permits fonts only from the same origin.
media-src 'self' : Allows media (videos, audios) only from the same origin.
-->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' https: wss: ws:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https: ; font-src 'self' ; media-src 'self'">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/ui/main.tsx"></script>
</body>

</html>
